name: Firestore Rules Tests

# Verifica firestore.rules en el emulador (Java gratis en el runner) antes de
# que las reglas lleguen a producción vía firebase-deploy.yml. Cero setup local.
on:
  push:
    paths:
      - 'firestore.rules'
      - 'tests/**'
      - '.github/workflows/firestore-rules-test.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/**'
  workflow_dispatch:

jobs:
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm install -g firebase-tools
      - name: Run Firestore rules tests in emulator
        run: firebase emulators:exec --only firestore --project demo-bersaglio "node --test tests/firestore-rules.test.mjs"
