name: Firestore Rules Tests

# Verifica firestore.rules en el emulador (Java gratis en el runner) antes de
# que las reglas lleguen a producción vía firebase-deploy.yml. Cero setup local.
# REACTIVADO 2026-06-09 (TODO-10, ADR §62): la suite corre verde local (53/53 con
# el mismo comando). Con filtro de paths: solo corre cuando cambian las reglas o
# sus tests — cost-aware (§3.6), no quema minutos del runner en commits de docs.
on:
  push:
    paths:
      - 'firestore.rules'
      - 'tests/firestore-rules.test.mjs'
      - '.github/workflows/firestore-rules-test.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/firestore-rules.test.mjs'
      - '.github/workflows/firestore-rules-test.yml'
  workflow_dispatch:

jobs:
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm install -g firebase-tools
      - name: Run Firestore rules tests in emulator
        run: firebase emulators:exec --only firestore --project demo-bersaglio "node --test tests/firestore-rules.test.mjs"
