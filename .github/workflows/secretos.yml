name: secretos

# 🚨 EL ESCÁNER DE CREDENCIALES, SIN FILTRO DE PATHS.
#
# Réplica del gate ya probado en el repo hermano de inmobiliaria (su §262 · auditoría #18, N18-06).
# Allí se MIDIÓ el agujero: el barrido vivía dentro de un predicado de carpeta en el hook, y el CI
# que lo repetía estaba detrás de un filtro `paths:` — entre los dos, 55 de los últimos 100 commits
# entraban a un repositorio PÚBLICO sin que nadie mirara si traían una credencial. Un secreto no
# pide permiso por carpeta; el gate tampoco. Por eso aquí NO hay `paths:`.
#
# 🛡️ Y por eso está en CI ADEMÁS de en el hook: `core.hooksPath` vive en `.git/config` y NO se
# clona. Un clon nuevo, otra máquina o un `--no-verify` y el hook deja de correr sin decirlo. Esto
# no se puede saltar.
#
# Las dos ramas del flujo real de este repo: el trabajo se commitea en `Desarrollo` y se mergea a
# `main` para producción (CLAUDE.md §2). Si el escáner solo mirara `main`, el autor se enteraría de
# su fuga cuando ya está publicada.
on:
  push:
    branches: [main, Desarrollo]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secretos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  escaner:
    name: Credenciales en un repo público
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Sin `npm ci`: el escáner no tiene dependencias a propósito, así que falla en segundos
      # si tiene que fallar. Lista los ficheros con `git ls-files` sobre el checkout.
      - name: verify:secretos
        run: node scripts/verify-secretos.mjs
