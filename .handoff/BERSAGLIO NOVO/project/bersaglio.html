<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Bersaglio Jewelry · Liquid Glass 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Manrope:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/liquid-glass.css"/>
</head>
<body>

<div class="bj-world" aria-hidden="true"></div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="js/tweaks-panel.jsx"></script>
<script type="text/babel" src="js/shell.jsx"></script>
<script type="text/babel" src="js/page-home.jsx"></script>
<script type="text/babel" src="js/pages.jsx"></script>

<script type="text/babel" data-presets="react">
function App() {
  const { route } = useRouter();
  const parts = route.split("/");
  const page = parts[0] || "home";

  // Tweaks
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "glassBlur": 28,
    "glassSaturate": 180,
    "iridescenceIntensity": 55
  }/*EDITMODE-END*/;
  const { values, update } = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    document.documentElement.style.setProperty("--glass-blur", values.glassBlur + "px");
    document.documentElement.style.setProperty("--glass-saturate", values.glassSaturate + "%");
  }, [values.glassBlur, values.glassSaturate]);

  let content;
  if (page === "home") content = <Home/>;
  else if (page === "catalogo") content = <Catalogo/>;
  else if (page === "producto") content = <Producto id={parts[1]}/>;
  else if (page === "nosotros") content = <Nosotros/>;
  else if (page === "contacto") content = <Contacto/>;
  else if (page === "checkout") content = <Checkout/>;
  else content = <Home/>;

  return (
    <>
      <Header/>
      <div data-screen-label={page}>
        {content}
      </div>
      <Footer/>
      <CartDrawer/>

      <TweaksPanel title="Tweaks · Liquid Glass">
        <TweakSection title="Intensidad del cristal">
          <TweakSlider label="Blur" value={values.glassBlur} min={0} max={60} step={2} onChange={v=>update("glassBlur",v)} unit="px"/>
          <TweakSlider label="Saturación" value={values.glassSaturate} min={100} max={260} step={10} onChange={v=>update("glassSaturate",v)} unit="%"/>
          <TweakSlider label="Iridescencia" value={values.iridescenceIntensity} min={0} max={100} step={5} onChange={v=>update("iridescenceIntensity",v)} unit="%"/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

function Root() {
  return (
    <RouterProvider>
      <CartProvider>
        <App/>
      </CartProvider>
    </RouterProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
