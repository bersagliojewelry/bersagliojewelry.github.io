<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Imagery" subtitle="Warm, jewel-toned, Cartagena cinematic" viewport="700x380" -->
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card" style="justify-content:flex-start;padding-top:24px">
  <div class="cap">Imagery · warm, cinematic, jewel-toned</div>
  <div class="row" style="gap:14px; align-items:stretch">
    <div style="flex:1.4;border-radius:24px;overflow:hidden;position:relative;box-shadow:var(--glass-shadow-lg);min-height:200px">
      <img src="../assets/banner-hero.webp" alt="Cartagena atelier" style="width:100%;height:100%;object-fit:cover;display:block">
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,oklch(18% 0.05 155 / 0.55))"></div>
      <div style="position:absolute;left:18px;bottom:16px;color:#fff;font-family:var(--font-display);font-style:italic;font-size:22px;text-shadow:0 2px 8px oklch(15% 0.05 155 / 0.7)">La Verde, 2026</div>
    </div>
    <div class="col" style="gap:14px">
      <div style="flex:1;border-radius:18px;overflow:hidden;box-shadow:var(--glass-shadow);min-height:93px"><img src="../assets/earrings-emerald.webp" alt="" style="width:100%;height:100%;object-fit:cover;filter:saturate(1.15) contrast(1.05)"></div>
      <div style="flex:1;border-radius:18px;overflow:hidden;box-shadow:var(--glass-shadow);min-height:93px"><img src="../assets/ring-sapphire.webp" alt="" style="width:100%;height:100%;object-fit:cover;filter:saturate(1.15) contrast(1.05)"></div>
    </div>
  </div>
  <div class="label">Emerald + 18K gold against velvet / Cartagena sunset. Warm white-balance, saturated (1.15 / 1.05), never B&amp;W. Rounded frames + protection vignettes.</div>
</div></body></html>
