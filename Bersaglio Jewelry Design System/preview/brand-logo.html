<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="cap">Logo &amp; lockup</div>
  <div class="row" style="gap:40px; align-items:center">

    <div style="display:flex;align-items:center;gap:14px">
      <svg width="58" height="61" viewBox="0 0 80 84" fill="none"><circle cx="40" cy="42" r="28" stroke="#0f5132" stroke-width="1.2" opacity="0.85"/><line x1="40" y1="4" x2="40" y2="80" stroke="#0f5132" stroke-width="0.8" opacity="0.5"/><text x="40" y="54" text-anchor="middle" font-family="Fraunces, serif" font-weight="600" font-size="32" fill="#0f5132">B</text></svg>

    </div>
  </div>
