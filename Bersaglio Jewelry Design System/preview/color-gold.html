<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="cap" style="color:var(--bj-gold-900)">Colombian 18k Gold · accent · hue 80–90</div>
  <div class="row" style="gap:0; border-radius:var(--r-md); overflow:hidden; box-shadow:var(--glass-shadow)">
    <div class="col" style="flex:1"><div style="height:90px; background:var(--bj-gold-900)"></div><div class="label" style="margin:6px 8px">900</div></div>
    <div class="col" style="flex:1"><div style="height:90px; background:var(--bj-gold-700)"></div><div class="label" style="margin:6px 8px">700</div></div>
    <div class="col" style="flex:1"><div style="height:90px; background:var(--bj-gold-500)"></div><div class="label" style="margin:6px 8px">500 ★</div></div>
    <div class="col" style="flex:1"><div style="height:90px; background:var(--bj-gold-300)"></div><div class="label" style="margin:6px 8px">300</div></div>
    <div class="col" style="flex:1"><div style="height:90px; background:var(--bj-gold-100)"></div><div class="label" style="margin:6px 8px">100</div></div>
  </div>
  <div class="label" style="margin-top:2px">Used sparingly — rim lights, dividers, dots, italic-headline gradient. Never large gold fills.</div>
</div></body></html>
