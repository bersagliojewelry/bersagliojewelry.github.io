<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="cap">Ink — luxury "black" is always emerald-tinted</div>
  <div class="row" style="gap:14px; align-items:stretch">
    <div class="col" style="flex:1; padding:16px; border-radius:var(--r-md); background:var(--bj-ink-emerald)"><span style="font-family:var(--font-display);font-size:26px;color:var(--bj-pearl)">Aa</span><div class="label" style="color:oklch(80% 0.04 150)">ink-emerald · text</div></div>
    <div class="col" style="flex:1; padding:16px; border-radius:var(--r-md); background:var(--bj-ink-soft)"><span style="font-family:var(--font-display);font-size:26px;color:var(--bj-pearl)">Aa</span><div class="label" style="color:oklch(85% 0.03 150)">ink-soft · body</div></div>
    <div class="col" style="flex:1; padding:16px; border-radius:var(--r-md); background:var(--bj-ink-mute)"><span style="font-family:var(--font-display);font-size:26px;color:var(--bj-pearl)">Aa</span><div class="label" style="color:oklch(90% 0.02 150)">ink-mute · meta</div></div>
  </div>
  <div class="cap" style="margin-top:8px">Semantic gradients in use</div>
  <div class="row">
    <span class="italic emerald-text" style="font-family:var(--font-display);font-size:30px">alma verde</span>
    <span class="italic gold-text" style="font-family:var(--font-display);font-size:30px">oro 18K</span>
  </div>
  <div class="label">There is no black anywhere. <code style="font-family:var(--font-mono)">ink-emerald = oklch(18% 0.05 155)</code></div>
</div></body></html>
