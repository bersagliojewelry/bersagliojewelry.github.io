<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="cap">Light neutrals · backgrounds are never pure white</div>
  <div class="row" style="gap:14px">
    <div class="col" style="flex:1"><div style="height:96px; background:var(--bj-pearl); border-radius:var(--r-md); box-shadow:var(--glass-shadow)"></div><div class="label">Pearl · page bg</div></div>
    <div class="col" style="flex:1"><div style="height:96px; background:var(--bj-ivory); border-radius:var(--r-md); box-shadow:var(--glass-shadow)"></div><div class="label">Ivory</div></div>
    <div class="col" style="flex:1"><div style="height:96px; background:var(--bj-cream); border-radius:var(--r-md); box-shadow:var(--glass-shadow)"></div><div class="label">Cream</div></div>
    <div class="col" style="flex:1"><div style="height:96px; background:var(--bj-mist); border-radius:var(--r-md); box-shadow:var(--glass-shadow)"></div><div class="label">Mist</div></div>
  </div>
  <div class="label" style="margin-top:2px">Pearl <code style="font-family:var(--font-mono)">oklch(98% 0.005 90)</code> is the canvas. Light "breathes" — never a flat fill.</div>
</div></body></html>
