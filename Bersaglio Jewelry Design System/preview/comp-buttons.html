<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="cap">Aqua buttons · gel refraction</div>
  <div class="row" style="gap:14px">
    <button class="btn-aqua">Explorar el catálogo
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
    <button class="btn-aqua btn-aqua-emerald">Agendar cita privada</button>
    <button class="btn-aqua btn-aqua-gold">Diseño a medida</button>
  </div>
  <div class="row" style="gap:14px">
    <button class="btn-aqua" style="padding:18px 30px">
      <span style="font-size:13px;letter-spacing:0.08em;text-transform:uppercase">Iniciar mi pieza</span>
      <span style="width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,var(--bj-emerald-700),var(--bj-emerald-900))">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg></span>
    </button>
  </div>
  <div class="label">Default / emerald / gold. Hover lifts &amp; deepens shadow; active presses to scale(0.96).</div>
</div></body></html>
