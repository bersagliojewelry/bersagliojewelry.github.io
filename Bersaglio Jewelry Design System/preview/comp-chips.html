<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="cap">Chips, dots &amp; dividers</div>
  <div class="row" style="gap:12px">
    <span class="chip"><span class="chip-dot"></span>Best Seller</span>
    <span class="chip"><span class="chip-dot" style="background:var(--bj-gold-500);box-shadow:0 0 8px var(--bj-gold-300)"></span>Edición limitada</span>
    <span class="chip">Editorial</span>
  </div>
  <div class="glass glass-emerald" style="display:inline-flex;align-self:flex-start;gap:6px;padding:6px 14px;border-radius:999px;font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase"><span class="chip-dot" style="background:var(--bj-gold-300)"></span>Atelier Bersaglio</div>
  <div class="row" style="align-items:center; gap:10px">
    <span style="width:34px;height:1px;background:linear-gradient(90deg,var(--bj-gold-500),transparent)"></span>
    <svg width="8" height="8" viewBox="0 0 10 10"><rect x="2.5" y="2.5" width="5" height="5" transform="rotate(45 5 5)" fill="var(--bj-gold-700)"/></svg>
    <span style="width:34px;height:1px;background:linear-gradient(270deg,var(--bj-gold-500),transparent)"></span>
    <span class="label" style="margin:0">diamond separator · gold hairline</span>
  </div>
</div></body></html>
