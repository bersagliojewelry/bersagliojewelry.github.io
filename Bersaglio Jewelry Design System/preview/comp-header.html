<!DOCTYPE html>
<!-- @dsCard group="Components" name="Header pill" subtitle="Dynamic Island floating nav" viewport="700x260" -->
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body style="background:
  radial-gradient(700px 460px at 30% 0%, oklch(72% 0.2 155 / 0.4), transparent 60%),
  linear-gradient(180deg, oklch(94% 0.03 150), oklch(91% 0.04 150))">
<div class="card" style="justify-content:flex-start;padding-top:36px">
  <div class="cap">Dynamic Island header pill</div>
  <div class="glass glass-iridescent" style="display:flex;align-items:center;gap:8px;padding:10px 14px 10px 22px;border-radius:999px;max-width:620px">
    <div style="display:flex;align-items:center;gap:10px;padding:4px 8px">
      <svg width="26" height="27" viewBox="0 0 80 84" fill="none"><circle cx="40" cy="42" r="28" stroke="#0f5132" stroke-width="1.2" opacity="0.85"/><line x1="40" y1="4" x2="40" y2="80" stroke="#0f5132" stroke-width="0.8" opacity="0.5"/><text x="40" y="54" text-anchor="middle" font-family="Fraunces, serif" font-weight="600" font-size="32" fill="#0f5132">B</text></svg>
      <div style="line-height:1"><div style="font-family:var(--font-brand);font-size:18px;font-weight:500;color:var(--bj-emerald-800);letter-spacing:0.05em">BERSAGLIO</div><div style="font-size:8px;letter-spacing:0.4em;color:var(--bj-ink-mute);text-transform:uppercase">Jewelry</div></div>
    </div>
    <nav style="display:flex;gap:2px;margin-left:auto;margin-right:8px;background:oklch(100% 0 0 / 0.35);padding:4px;border-radius:999px;border:1px solid oklch(100% 0 0 / 0.5)">
      <span style="padding:8px 16px;font-size:13px;font-weight:500;border-radius:999px;color:#fff;background:linear-gradient(180deg,oklch(62% 0.18 155),oklch(42% 0.14 155))">Inicio</span>
      <span style="padding:8px 16px;font-size:13px;font-weight:500;border-radius:999px;color:var(--bj-emerald-800)">Colecciones</span>
      <span style="padding:8px 16px;font-size:13px;font-weight:500;border-radius:999px;color:var(--bj-emerald-800)">Nosotros</span>
    </nav>
    <span style="position:relative;width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:oklch(100% 0 0 / 0.6);border:1px solid oklch(100% 0 0 / 0.6);color:var(--bj-emerald-800)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2l-2 5v15h16V7l-2-5H6z"/><path d="M4 7h16M10 11a2 2 0 0 0 4 0"/></svg>
      <span style="position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bj-emerald-600);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;border:2px solid var(--bj-pearl)">1</span>
    </span>
  </div>
  <div class="label">Floating top:18px, centered. Shrinks to scale(0.97) &amp; raises blur on scroll. Active nav = emerald gel pill.</div>
</div></body></html>
