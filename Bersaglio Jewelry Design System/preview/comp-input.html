<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="cap">Form input &amp; command palette</div>
  <input style="padding:14px 18px;font-family:var(--font-ui);font-size:15px;color:var(--bj-ink-emerald);background:oklch(100% 0 0 / 0.7);border:1px solid oklch(100% 0 0 / 0.6);border-radius:999px;outline:none;width:100%;box-shadow:0 0 0 3px oklch(62% 0.18 155 / 0.18)" value="kary@bersagliojewelry.co">
  <div class="glass" style="border-radius:24px;padding:8px;max-width:560px">
    <div style="display:flex;align-items:center;gap:12px;padding:10px 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--bj-emerald-700)" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span style="flex:1;font-size:16px;color:var(--bj-ink-mute)">Buscar piezas, colecciones…</span>
      <span style="padding:4px 8px;border-radius:6px;background:oklch(100% 0 0 / 0.6);border:1px solid oklch(100% 0 0 / 0.5);font-family:var(--font-mono);font-size:10px;color:var(--bj-ink-mute)">Ctrl K</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:16px;background:oklch(100% 0 0 / 0.7)">
      <div style="width:44px;height:44px;border-radius:12px;background:url('../assets/ring-sapphire.webp') center/cover"></div>
      <div style="flex:1"><div style="font-size:14px;font-weight:500;color:var(--bj-ink-emerald)">Anillo Trinity</div><div style="font-size:11.5px;color:var(--bj-ink-mute)">Anillos</div></div>
      <span style="font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--bj-emerald-700)">$ 14.8M</span>
    </div>
  </div>
  <div class="label">Pill inputs, focus = gold/emerald ring. Ctrl K glass palette with thumbnail results.</div>
</div></body></html>
