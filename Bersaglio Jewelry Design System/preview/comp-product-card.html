<!DOCTYPE html>
<!-- @dsCard group="Components" name="Product card" subtitle="Catalog tile · chip + wishlist + price" viewport="700x560" -->
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card" style="justify-content:flex-start;padding-top:24px">
  <div class="cap">Product card · catalog tile</div>
  <a class="glass glass-iridescent" style="width:288px;border-radius:30px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit">
    <div style="position:relative;aspect-ratio:4/5;overflow:hidden">
      <div style="position:absolute;inset:0;background:url('../assets/earrings-emerald.webp') center/cover"></div>
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,oklch(92% 0.06 150 / 0.15) 0%,transparent 30%,oklch(20% 0.05 155 / 0.18))"></div>
      <div style="position:absolute;top:14px;left:14px"><span class="chip" style="background:oklch(20% 0.05 155 / 0.5);color:#fff;border:1px solid oklch(100% 0 0 / 0.4)"><span class="chip-dot" style="background:var(--bj-gold-500)"></span>Best Seller</span></div>
      <div style="position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:999px;background:oklch(100% 0 0 / 0.7);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;border:1px solid oklch(100% 0 0 / 0.7);color:var(--bj-emerald-700)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
    </div>
    <div style="padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px">
      <div style="font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--bj-ink-mute)">Aretes</div>
      <div style="font-family:var(--font-display);font-size:22px;font-weight:500;color:var(--bj-ink-emerald);line-height:1.2">Topos Halo Esmeralda</div>
      <div style="font-size:12px;color:var(--bj-ink-soft)">Esmeralda · Diamante · Oro 18K</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:14px;border-top:1px solid oklch(100% 0 0 / 0.5)">
        <span style="font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--bj-emerald-800)">$ 12.400.000</span>
        <span style="font-size:11px;color:var(--bj-ink-mute);display:flex;align-items:center;gap:4px">Ver pieza <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg></span>
      </div>
    </div>
  </a>
</div></body></html>
