<!DOCTYPE html>
<!-- @dsCard group="Components" name="Service cards" subtitle="Line-icon medallions on glass" viewport="700x330" -->
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="cap">Service cards · line icons</div>
  <div class="row" style="gap:14px; align-items:stretch">
    <div class="glass" style="flex:1;padding:22px 18px;border-radius:24px;text-align:center">
      <div style="width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle at 30% 30%, oklch(95% 0.08 150), oklch(65% 0.17 155) 70%);box-shadow:inset 0 2px 0 oklch(100% 0 0 / 0.9), 0 8px 24px -4px oklch(50% 0.15 155 / 0.4);display:flex;align-items:center;justify-content:center;color:#fff">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>
      <div style="font-family:var(--font-display);font-size:18px;font-weight:500;color:var(--bj-ink-emerald);margin-bottom:6px">Diseño a medida</div>
      <p style="font-size:12.5px;color:var(--bj-ink-soft);line-height:1.5">Desde boceto hasta entrega.</p>
    </div>
    <div class="glass" style="flex:1;padding:22px 18px;border-radius:24px;text-align:center">
      <div style="width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle at 30% 30%, oklch(95% 0.08 150), oklch(65% 0.17 155) 70%);box-shadow:inset 0 2px 0 oklch(100% 0 0 / 0.9), 0 8px 24px -4px oklch(50% 0.15 155 / 0.4);display:flex;align-items:center;justify-content:center;color:#fff">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
      <div style="font-family:var(--font-display);font-size:18px;font-weight:500;color:var(--bj-ink-emerald);margin-bottom:6px">Garantía vitalicia</div>
      <p style="font-size:12.5px;color:var(--bj-ink-soft);line-height:1.5">Pulido y verificación de por vida.</p>
    </div>
    <div class="glass" style="flex:1;padding:22px 18px;border-radius:24px;text-align:center">
      <div style="width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle at 30% 30%, oklch(95% 0.08 150), oklch(65% 0.17 155) 70%);box-shadow:inset 0 2px 0 oklch(100% 0 0 / 0.9), 0 8px 24px -4px oklch(50% 0.15 155 / 0.4);display:flex;align-items:center;justify-content:center;color:#fff">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 6L9 17l-5-5"/></svg></div>
      <div style="font-family:var(--font-display);font-size:18px;font-weight:500;color:var(--bj-ink-emerald);margin-bottom:6px">Certificación GIA</div>
      <p style="font-size:12.5px;color:var(--bj-ink-soft);line-height:1.5">Cada diamante, su reporte.</p>
    </div>
  </div>
  <div class="label">Stroke-only line icons in a radial-emerald medallion. Lucide is the documented CDN match.</div>
</div></body></html>
