<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="cap">Elevation · light catching glass</div>
  <div class="row" style="gap:26px; padding:8px 4px 18px">
    <div class="col"><div style="width:150px;height:84px;border-radius:var(--r-md);background:var(--bj-pearl);box-shadow:var(--glass-shadow)"></div><div class="label">--glass-shadow · cards</div></div>
    <div class="col"><div style="width:150px;height:84px;border-radius:var(--r-lg);background:var(--bj-pearl);box-shadow:var(--glass-shadow-lg)"></div><div class="label">--glass-shadow-lg · drawers, scrolled header</div></div>
  </div>
  <div class="label">No hard drop shadows. Each is multi-layer: inner top-white highlight + inner bottom-dark + soft emerald ambient + long throw.</div>
</div></body></html>
