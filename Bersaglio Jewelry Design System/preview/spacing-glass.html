<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body style="background:
  radial-gradient(700px 500px at 20% 10%, oklch(72% 0.2 155 / 0.55), transparent 60%),
  radial-gradient(600px 460px at 88% 80%, oklch(88% 0.14 85 / 0.55), transparent 55%),
  linear-gradient(180deg, oklch(94% 0.03 150), oklch(90% 0.04 150))">
<div class="card">
  <div class="cap">Glass primitive · the structural base</div>
  <div class="row" style="gap:16px; align-items:stretch">
    <div class="glass" style="flex:1; padding:20px; border-radius:var(--r-lg)"><div style="font-family:var(--font-display);font-size:22px;color:var(--bj-ink-emerald)">.glass</div><div class="label">blur 28 · saturate 180 · pinlight + hairline</div></div>
    <div class="glass glass-iridescent" style="flex:1; padding:20px; border-radius:var(--r-lg)"><div style="font-family:var(--font-display);font-size:22px;color:var(--bj-ink-emerald)">.glass-iridescent</div><div class="label">conic oil-on-water rim</div></div>
    <div class="glass glass-emerald" style="flex:1; padding:20px; border-radius:var(--r-lg)"><div style="font-family:var(--font-display);font-size:22px">.glass-emerald</div><div class="label" style="color:oklch(88% 0.05 150)">tinted dark variant</div></div>
  </div>
</div></body></html>
