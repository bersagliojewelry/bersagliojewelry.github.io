<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="cap">Radii · soft squircles</div>
  <div class="row" style="gap:16px; align-items:flex-end">
    <div class="col"><div style="width:64px;height:64px;border-radius:12px;background:var(--bj-emerald-200);box-shadow:var(--glass-shadow)"></div><div class="label">sm · 12</div></div>
    <div class="col"><div style="width:70px;height:70px;border-radius:18px;background:var(--bj-emerald-300);box-shadow:var(--glass-shadow)"></div><div class="label">md · 18</div></div>
    <div class="col"><div style="width:78px;height:78px;border-radius:24px;background:var(--bj-emerald-400);box-shadow:var(--glass-shadow)"></div><div class="label">lg · 24</div></div>
    <div class="col"><div style="width:88px;height:88px;border-radius:34px;background:var(--bj-emerald-500);box-shadow:var(--glass-shadow)"></div><div class="label">xl · 34</div></div>
    <div class="col"><div style="width:96px;height:96px;border-radius:48px;background:var(--bj-emerald-600);box-shadow:var(--glass-shadow)"></div><div class="label">2xl · 48</div></div>
    <div class="col"><div style="width:64px;height:64px;border-radius:999px;background:var(--bj-gold-500);box-shadow:var(--glass-shadow)"></div><div class="label">pill</div></div>
  </div>
  <div class="label">Nothing is sharp. Buttons &amp; chips = pill; cards = 24–34; hero frame = 40.</div>
</div></body></html>
