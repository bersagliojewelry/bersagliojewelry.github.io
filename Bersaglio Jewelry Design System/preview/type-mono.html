<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="cap">Mono &amp; eyebrow · Space Mono</div>
  <div class="row" style="gap:32px; align-items:baseline">
    <span style="font-family:var(--font-mono); font-size:22px; font-weight:700; color:var(--bj-emerald-800); font-variant-numeric:tabular-nums">$ 14.800.000 COP</span>
  </div>
  <div class="row" style="gap:24px">
    <span class="eyebrow">Curaduría del Atelier</span>
    <span class="eyebrow" style="color:var(--bj-ink-mute)">Est. 2014</span>
  </div>
  <div class="row" style="gap:10px; align-items:center">
    <span style="display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;letter-spacing:0.18em;color:var(--bj-emerald-700)"><span style="width:7px;height:7px;border-radius:50%;background:oklch(60% 0.2 25);box-shadow:0 0 8px oklch(60% 0.2 25)"></span>EN VIVO</span>
    <span style="font-family:var(--font-mono); font-size:11px; letter-spacing:0.18em; color:var(--bj-ink-mute)">CARTAGENA · COLOMBIA</span>
  </div>
  <div class="label">Mono = prices, coordinates, issue numbers, "EN VIVO" tags. Eyebrows = UPPERCASE, 0.28–0.32em tracking.</div>
</div></body></html>
