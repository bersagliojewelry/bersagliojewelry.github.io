<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandeja — Bersaglio Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..500&family=Cormorant+Garamond:ital,wght@0,300..600;1,300..400&family=Manrope:wght@300..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script type="module" src="js/admin/consultas.js"></script>
</head>
<body style="display:none">
<script>try{if(sessionStorage.getItem('bj_auth')){document.body.style.display=''}else{location.replace('admin-login.html')}}catch(e){location.replace('admin-login.html')}</script>
<div class="adm-layout">

    <!-- Sidebar (se rellena desde datos por js/admin/shared.js → renderSidebar) -->
    <aside class="adm-sidebar"></aside>
    <div class="adm-sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Main -->
    <main class="adm-main">
        <header class="adm-topbar">
            <button class="adm-hamburger" id="hamburger-btn" aria-label="Menú">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="22" height="22"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1>Bandeja</h1>
            <div class="adm-topbar-actions">
                <button class="adm-btn adm-btn--ghost" id="btn-export-csv">↓ Exportar CSV</button>
                <button class="adm-btn adm-btn--primary" id="btn-nuevo-lead">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
                    Nuevo lead
                </button>
            </div>
        </header>

        <div class="adm-content">

            <!-- Filtros por estado del pipeline + búsqueda -->
            <div class="adm-toolbar">
                <div class="adm-filters" id="inq-filters" style="flex-wrap:wrap;">
                    <button class="adm-filter-btn is-active" data-filter="todos">Todos <span class="inq-chip-n"></span></button>
                    <button class="adm-filter-btn" data-filter="nuevo">Nuevos <span class="inq-chip-n"></span></button>
                    <button class="adm-filter-btn" data-filter="trabajando">Trabajando <span class="inq-chip-n"></span></button>
                    <button class="adm-filter-btn" data-filter="calificado">Calificados <span class="inq-chip-n"></span></button>
                    <button class="adm-filter-btn" data-filter="convertido">Clientes <span class="inq-chip-n"></span></button>
                    <button class="adm-filter-btn" data-filter="perdido">Perdidos <span class="inq-chip-n"></span></button>
                </div>
                <div class="adm-search">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
                    <input type="search" id="search-input" placeholder="Buscar por nombre, email o teléfono…">
                </div>
            </div>

            <!-- Tabla de leads -->
            <div class="adm-table-wrap">
                <table class="adm-table">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Nombre</th>
                            <th>Contacto</th>
                            <th>Origen</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="inq-tbody"></tbody>
                </table>
            </div>
            <div id="inq-empty" class="adm-empty" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" width="48" height="48"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z"/></svg>
                <p>No hay leads con ese filtro.</p>
            </div>

        </div>
    </main>
</div>

<!-- Modal: ver/gestionar lead -->
<div class="adm-modal" id="inq-modal" hidden>
    <div class="adm-modal-box">
        <div class="adm-modal-head">
            <h2 id="inq-modal-title">Lead</h2>
            <button class="adm-modal-close" id="inq-modal-close" aria-label="Cerrar">✕</button>
        </div>
        <div class="adm-modal-body">
            <div style="display:grid;gap:12px;">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                    <div>
                        <div class="adm-kv-label">Nombre</div>
                        <div id="inq-detail-name" style="font-size:14px;font-weight:500;"></div>
                    </div>
                    <div>
                        <div class="adm-kv-label">Fecha</div>
                        <div id="inq-detail-date" style="font-size:14px;"></div>
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                    <div>
                        <div class="adm-kv-label">Email</div>
                        <div id="inq-detail-email" style="font-size:14px;"></div>
                    </div>
                    <div>
                        <div class="adm-kv-label">Teléfono</div>
                        <div id="inq-detail-phone" style="font-size:14px;"></div>
                    </div>
                </div>
                <div>
                    <div class="adm-kv-label">Origen</div>
                    <div id="inq-detail-origen" style="font-size:14px;"></div>
                </div>
                <div id="inq-detail-piece-wrap">
                    <div class="adm-kv-label">Pieza de interés</div>
                    <div id="inq-detail-piece" style="font-size:14px;"></div>
                </div>
                <div>
                    <div class="adm-kv-label">Mensaje</div>
                    <div id="inq-detail-message" class="adm-inq-detail"></div>
                </div>
                <div>
                    <div class="adm-kv-label">Estado del lead</div>
                    <div class="adm-filters" id="inq-status-btns" style="flex-wrap:wrap;margin-top:4px;"></div>
                </div>
            </div>
        </div>
        <div class="adm-modal-foot" style="flex-wrap:wrap;gap:8px;">
            <button class="adm-btn adm-btn--ghost adm-btn--danger" id="inq-modal-delete" hidden>Eliminar</button>
            <a class="adm-btn adm-btn--ghost" id="inq-modal-ficha" href="#" hidden>Ver ficha del cliente</a>
            <button class="adm-btn adm-btn--ghost" id="inq-modal-convert" hidden>★ Convertir a cliente</button>
            <a class="adm-btn adm-btn--primary" id="inq-modal-wa" href="#" target="_blank" rel="noopener">Responder por WhatsApp</a>
        </div>
    </div>
</div>

<!-- Modal: nuevo lead (alta manual / mostrador) -->
<div class="adm-modal" id="nuevo-modal" hidden>
    <div class="adm-modal-box">
        <div class="adm-modal-head">
            <h2>Nuevo lead</h2>
            <button class="adm-modal-close" id="nuevo-close" aria-label="Cerrar">✕</button>
        </div>
        <form id="nuevo-form">
            <div class="adm-modal-body">
                <div class="adm-form-row adm-col-1">
                    <div class="adm-field">
                        <label for="nl-nombre">Nombre <span class="adm-opt">(obligatorio)</span></label>
                        <input type="text" id="nl-nombre" class="adm-input" required maxlength="120" autocomplete="off">
                    </div>
                </div>
                <div class="adm-form-row">
                    <div class="adm-field">
                        <label for="nl-telefono">Teléfono / WhatsApp</label>
                        <input type="tel" id="nl-telefono" class="adm-input" maxlength="40" autocomplete="off">
                    </div>
                    <div class="adm-field">
                        <label for="nl-origen">Origen</label>
                        <select id="nl-origen" class="adm-input">
                            <option value="mostrador">Mostrador</option>
                            <option value="whatsapp">WhatsApp</option>
                            <option value="instagram">Instagram</option>
                            <option value="manual">Otro</option>
                        </select>
                    </div>
                </div>
                <div class="adm-form-row adm-col-1">
                    <div class="adm-field">
                        <label for="nl-email">Email</label>
                        <input type="email" id="nl-email" class="adm-input" maxlength="120" autocomplete="off">
                    </div>
                </div>
                <div class="adm-form-row adm-col-1">
                    <div class="adm-field">
                        <label for="nl-mensaje">Nota / interés</label>
                        <textarea id="nl-mensaje" class="adm-input" maxlength="500"></textarea>
                    </div>
                </div>
            </div>
            <div class="adm-modal-foot">
                <button type="button" class="adm-btn adm-btn--ghost" id="nuevo-cancel">Cancelar</button>
                <button type="submit" class="adm-btn adm-btn--primary" id="nuevo-save">Agregar lead</button>
            </div>
        </form>
    </div>
</div>

<div class="adm-toast-wrap" id="toast-wrap"></div>
</body>
</html>
