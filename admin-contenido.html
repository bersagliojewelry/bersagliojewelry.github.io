<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contenido web — Bersaglio Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..500&family=Cormorant+Garamond:ital,wght@0,300..600;1,300..400&family=Manrope:wght@300..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        /* Barra de pestañas del panel de contenido (scoped, sin tocar admin.css). */
        .adm-tabs { display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--adm-border); margin-bottom:20px; }
        .adm-tab {
            appearance:none; background:none; border:none; cursor:pointer;
            padding:10px 16px; font:inherit; font-size:14px; color:var(--adm-muted);
            border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s,border-color .15s;
        }
        .adm-tab:hover { color:var(--adm-text, #eee); }
        .adm-tab.is-active { color:var(--adm-accent); border-bottom-color:var(--adm-accent); font-weight:600; }
    </style>
    <script type="module" src="js/admin/contenido.js"></script>
</head>
<body style="display:none">
<script>try{if(sessionStorage.getItem('bj_auth')){document.body.style.display=''}else{location.replace('admin-login.html')}}catch(e){location.replace('admin-login.html')}</script>
<div class="adm-layout">

    <!-- Sidebar (se rellena desde datos por js/admin/shared.js → renderSidebar) -->
    <aside class="adm-sidebar"></aside>
    <div class="adm-sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Main -->
    <main class="adm-main">
        <header class="adm-topbar">
            <button class="adm-hamburger" id="hamburger-btn" aria-label="Menú">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="22" height="22"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1>Contenido web · <span id="content-title">Journal</span></h1>
        </header>

        <div class="adm-content">
            <!-- Tarjeta "Estado de tu web" (cero-ficción · resumen vivo para Kary) -->
            <div id="estado-web" style="margin-bottom:20px;"></div>
            <!-- Barra de pestañas (la pinta js/admin/contenido.js desde el registro) -->
            <nav class="adm-tabs" id="content-tabs" aria-label="Secciones de contenido"></nav>
            <!-- Host de la pestaña activa (el motor monta aquí su tabla + modal) -->
            <div id="tab-host"></div>
        </div>
    </main>
</div>

<!-- Confirm delete (compartido — lo usa admConfirm) -->
<div class="adm-confirm" id="confirm-dialog" hidden>
    <div class="adm-confirm-box">
        <h3>¿Confirmar?</h3>
        <p id="confirm-msg">Esta acción no se puede deshacer.</p>
        <div class="adm-confirm-actions">
            <button class="adm-btn adm-btn--ghost" id="confirm-cancel">Cancelar</button>
            <button class="adm-btn adm-btn--danger" id="confirm-ok">Eliminar</button>
        </div>
    </div>
</div>

<div class="adm-toast-wrap" id="toast-wrap"></div>
</body>
</html>
