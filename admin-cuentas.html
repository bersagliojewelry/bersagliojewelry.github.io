<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartera — Bersaglio Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..500&family=Cormorant+Garamond:ital,wght@0,300..600;1,300..400&family=Manrope:wght@300..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script type="module" src="js/admin/cuentas.js"></script>
</head>
<body style="display:none">
<script>try{if(sessionStorage.getItem('bj_auth')){document.body.style.display=''}else{location.replace('admin-login.html')}}catch(e){location.replace('admin-login.html')}</script>
<div class="adm-layout">

    <!-- Sidebar (se rellena desde datos por js/admin/shared.js → renderSidebar) -->
    <aside class="adm-sidebar"></aside>
    <div class="adm-sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Main -->
    <main class="adm-main">
        <header class="adm-topbar">
            <button class="adm-hamburger" id="hamburger-btn" aria-label="Menú">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="22" height="22"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1>Cartera</h1>
            <div class="adm-topbar-actions">
                <a href="admin-clientes.html" class="adm-btn adm-btn--ghost" title="Ver el directorio de clientes">← Ver clientes</a>
            </div>
        </header>

        <div class="adm-content">

            <!-- Cartera (stats) -->
            <div class="adm-stats">
                <div class="adm-stat-card">
                    <div class="adm-stat-icon adm-stat-icon--emerald">
                        <svg viewBox="0 0 20 20" fill="currentColor" width="20" height="20"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z"/><path fill-rule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zm-5 4a1 1 0 011-1h2a1 1 0 110 2h-2a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>
                    </div>
                    <div class="adm-stat-body">
                        <div class="adm-stat-value" id="stat-por-cobrar">—</div>
                        <div class="adm-stat-label">Total por cobrar</div>
                    </div>
                </div>
                <div class="adm-stat-card">
                    <div class="adm-stat-icon adm-stat-icon--red">
                        <svg viewBox="0 0 20 20" fill="currentColor" width="20" height="20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                    </div>
                    <div class="adm-stat-body">
                        <div class="adm-stat-value adm-money adm-money--debe" id="stat-vencida">—</div>
                        <div class="adm-stat-label">Cartera vencida</div>
                        <div class="adm-aging-desglose" id="stat-vencida-desglose"></div>
                    </div>
                </div>
                <div class="adm-stat-card">
                    <div class="adm-stat-icon adm-stat-icon--gold">
                        <svg viewBox="0 0 20 20" fill="currentColor" width="20" height="20"><path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z"/></svg>
                    </div>
                    <div class="adm-stat-body">
                        <div class="adm-stat-value" id="stat-clientes">—</div>
                        <div class="adm-stat-label">Clientes con cuenta</div>
                    </div>
                </div>
                <div class="adm-stat-card">
                    <div class="adm-stat-icon adm-stat-icon--green">
                        <svg viewBox="0 0 20 20" fill="currentColor" width="20" height="20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                    </div>
                    <div class="adm-stat-body">
                        <div class="adm-stat-value" id="stat-a-favor">—</div>
                        <div class="adm-stat-label">Saldo a favor (clientes)</div>
                    </div>
                </div>
            </div>

            <!-- Cartera por vendedora -->
            <div class="adm-section">
                <div class="adm-section-head"><h2>Cartera por vendedora</h2></div>
                <div class="adm-table-wrap">
                    <table class="adm-table">
                        <thead><tr><th>Vendedora</th><th>Clientes</th><th style="text-align:right">Por cobrar</th></tr></thead>
                        <tbody id="cartera-vendedora-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- Clientes -->
            <div class="adm-section">
                <div class="adm-section-head">
                    <h2>Cuentas por cliente</h2>
                    <input type="search" id="cli-search" class="adm-input" placeholder="Buscar por nombre…" style="max-width:260px;">
                </div>
                <div class="adm-filtros-bar" id="cli-filtros">
                    <div class="adm-filters" data-group="estado">
                        <button type="button" class="adm-filter-btn is-active" data-estado="todos">Todos</button>
                        <button type="button" class="adm-filter-btn" data-estado="vencido">Vencidos</button>
                        <button type="button" class="adm-filter-btn" data-estado="aldia">Al día</button>
                        <button type="button" class="adm-filter-btn" data-estado="favor">A favor</button>
                    </div>
                    <div class="adm-filters" data-group="rango">
                        <span class="adm-filtros-label">Mora:</span>
                        <button type="button" class="adm-filter-btn is-active" data-rango="todos">Todas</button>
                        <button type="button" class="adm-filter-btn" data-rango="d1_30">1-30</button>
                        <button type="button" class="adm-filter-btn" data-rango="d31_60">31-60</button>
                        <button type="button" class="adm-filter-btn" data-rango="d60plus">+60</button>
                    </div>
                    <select id="cli-filtro-vendedora" class="adm-input adm-filtro-sel">
                        <option value="">Todas las vendedoras</option>
                    </select>
                    <span class="adm-filtros-count" id="cli-count"></span>
                </div>
                <div id="clientes-wrap">
                    <div class="adm-table-wrap">
                        <table class="adm-table" id="clientes-table">
                            <thead><tr>
                                <th>Cliente</th>
                                <th>Vendedora</th>
                                <th>Estado</th>
                                <th style="text-align:right">Vencido</th>
                                <th style="text-align:right">Saldo</th>
                            </tr></thead>
                            <tbody id="clientes-body"></tbody>
                        </table>
                    </div>
                    <div class="adm-empty" id="clientes-empty" hidden>
                        <p>Aún no hay clientes registrados. Agrégalos en la sección <strong>Clientes</strong>.</p>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>

<!-- Toast container -->
<div class="adm-toast-wrap" id="toast-wrap"></div>
</body>
</html>
