<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoy — Bersaglio Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..500&family=Cormorant+Garamond:ital,wght@0,300..600;1,300..400&family=Manrope:wght@300..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script type="module" src="js/admin/dashboard.js"></script>
</head>
<body style="display:none">
<script>try{if(sessionStorage.getItem('bj_auth')){document.body.style.display=''}else{location.replace('admin-login.html')}}catch(e){location.replace('admin-login.html')}</script>
<div class="adm-layout">

    <!-- Sidebar (se rellena desde datos por js/admin/shared.js → renderSidebar) -->
    <aside class="adm-sidebar"></aside>
    <div class="adm-sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Main -->
    <main class="adm-main">
        <header class="adm-topbar">
            <button class="adm-hamburger" id="hamburger-btn" aria-label="Menú">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="22" height="22"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1>Hoy</h1>
            <div class="adm-topbar-actions">
                <a href="admin-piezas.html?new=1" class="adm-btn adm-btn--primary">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
                    Nueva pieza
                </a>
            </div>
        </header>

        <div class="adm-content">

            <!-- Stats -->
            <div class="adm-stats" id="stats-grid">
                <div class="adm-stat-card">
                    <div class="adm-stat-icon adm-stat-icon--emerald">
                        <svg viewBox="0 0 20 20" fill="currentColor" width="20" height="20"><path fill-rule="evenodd" d="M10 2L3 7l7 5 7-5-7-5zM3 13l7 5 7-5-7-5-7 5z" clip-rule="evenodd"/></svg>
                    </div>
                    <div class="adm-stat-body">
                        <div class="adm-stat-value" id="stat-total-piezas">—</div>
                        <div class="adm-stat-label">Total piezas</div>
                    </div>
                </div>
                <div class="adm-stat-card">
                    <div class="adm-stat-icon adm-stat-icon--gold">
                        <svg viewBox="0 0 20 20" fill="currentColor" width="20" height="20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                    </div>
                    <div class="adm-stat-body">
                        <div class="adm-stat-value" id="stat-destacadas">—</div>
                        <div class="adm-stat-label">Piezas destacadas</div>
                    </div>
                </div>
                <div class="adm-stat-card">
                    <div class="adm-stat-icon adm-stat-icon--green">
                        <svg viewBox="0 0 20 20" fill="currentColor" width="20" height="20"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zm-2 4a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"/></svg>
                    </div>
                    <div class="adm-stat-body">
                        <div class="adm-stat-value" id="stat-colecciones">—</div>
                        <div class="adm-stat-label">Colecciones activas</div>
                    </div>
                </div>
                <div class="adm-stat-card">
                    <div class="adm-stat-icon adm-stat-icon--red">
                        <svg viewBox="0 0 20 20" fill="currentColor" width="20" height="20"><path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7z" clip-rule="evenodd"/></svg>
                    </div>
                    <div class="adm-stat-body">
                        <div class="adm-stat-value" id="stat-consultas">—</div>
                        <div class="adm-stat-label">Leads pendientes</div>
                    </div>
                </div>
            </div>

            <!-- Recent inquiries -->
            <div class="adm-section">
                <div class="adm-section-head">
                    <h2>Consultas recientes</h2>
                    <a href="admin-consultas.html" class="adm-btn adm-btn--ghost adm-btn--sm">Ver todas →</a>
                </div>
                <div id="recent-inquiries-wrap">
                    <div class="adm-table-wrap">
                        <table class="adm-table" id="recent-inquiries-table">
                            <thead><tr>
                                <th>Fecha</th>
                                <th>Nombre</th>
                                <th>Pieza</th>
                                <th>Estado</th>
                                <th></th>
                            </tr></thead>
                            <tbody id="recent-inquiries-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Quick actions -->
            <div class="adm-section">
                <div class="adm-section-head"><h2>Acciones rápidas</h2></div>
                <div class="adm-section-body" style="display:flex;gap:10px;flex-wrap:wrap;">
                    <a href="admin-piezas.html?new=1" class="adm-btn adm-btn--ghost">+ Nueva pieza</a>
                    <a href="admin-colecciones.html" class="adm-btn adm-btn--ghost">Gestionar colecciones</a>
                    <a href="admin-consultas.html" class="adm-btn adm-btn--ghost">Ver consultas</a>
                    <button id="btn-export-quick" class="adm-btn adm-btn--ghost">↓ Exportar piezas CSV</button>
                </div>
            </div>

        </div>
    </main>
</div>

<!-- Toast container -->
<div class="adm-toast-wrap" id="toast-wrap"></div>
</body>
</html>
