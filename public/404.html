<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Bersaglio Jewelry</title>
    <meta name="robots" content="noindex, nofollow">
    <script>
    /* Fallback SSG (TODO-35): una pieza recién creada por el admin aún no tiene su
       archivo horneado /pieza/<slug>.html (se hornea en el próximo build/cron diario).
       Mientras tanto, redirige al shell SPA que la renderiza EN VIVO desde Firestore →
       cero 404 para piezas nuevas. Las páginas realmente inexistentes ven este 404. */
    (function () {
        var m = location.pathname.match(/^\/pieza\/(.+?)\.html?$/i);
        if (m && m[1]) {
            location.replace('/pieza.html?p=' + encodeURIComponent(decodeURIComponent(m[1])));
            return;
        }
        /* Link compartible /p/<code> (TODO-58 slice 2): el SSG hornea /p/<code>.html (stub con OG
           que redirige a la pieza). Si Pages no sirvió la versión sin extensión, reintenta con
           .html; si el stub tampoco existe (código inexistente/no horneado aún), recupera al
           catálogo con el código en el buscador (filtra en vivo desde catalogo.json). Sin bucle:
           el reintento .html cae a la rama de catálogo, no de vuelta a /p/. */
        var pm = location.pathname.match(/^\/p\/([^\/]+?)(\.html?)?$/i);
        if (pm && pm[1]) {
            var code = encodeURIComponent(decodeURIComponent(pm[1]));
            location.replace(pm[2] ? ('/colecciones.html?q=' + code) : ('/p/' + code + '.html'));
        }
    })();
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --gold:    #C9A84C;
            --dark:    #0a0a0a;
            --surface: #111111;
            --border:  rgba(255,255,255,0.08);
            --text:    #F0EBE0;
            --muted:   rgba(240,235,224,0.45);
        }

        html, body {
            height: 100%;
            background: var(--dark);
            color: var(--text);
            font-family: 'Georgia', 'Times New Roman', serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 40px 24px;
            text-align: center;
        }

        .gem {
            margin-bottom: 40px;
            color: rgba(201, 168, 76, 0.25);
            animation: gem-float 4s ease-in-out infinite;
        }
        @keyframes gem-float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%       { transform: translateY(-8px) rotate(3deg); }
        }
        .gem svg { filter: drop-shadow(0 0 12px rgba(201,168,76,0.3)); }

        .ornament {
            width: 40px;
            height: 1px;
            background: var(--gold);
            margin: 0 auto 28px;
            opacity: 0.5;
        }

        .eyebrow {
            font-family: 'Arial Narrow', Arial, sans-serif;
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 16px;
            opacity: 0.9;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3.2rem);
            font-weight: 300;
            line-height: 1.15;
            letter-spacing: -0.01em;
            color: var(--text);
            margin-bottom: 18px;
        }
        h1 em { font-style: italic; color: var(--gold); }

        p {
            font-size: 15px;
            font-weight: 400;
            color: var(--muted);
            line-height: 1.7;
            max-width: 380px;
            margin: 0 auto 36px;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 28px;
            font-family: 'Arial Narrow', Arial, sans-serif;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 2px;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--gold);
            color: #0a0a0a;
            border: 1px solid var(--gold);
        }
        .btn-primary:hover { background: #d9b95c; }

        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

        /* Recuperación por código (TODO-58 slice 5): el cliente perdido teclea el código que le dio
           Kary → GET nativo a /colecciones.html?q=<code> (el catálogo filtra en vivo; sin JS/bundle). */
        .code-search { width: 100%; max-width: 420px; margin: 0 auto 36px; }
        .code-search-label {
            display: block;
            font-family: 'Arial Narrow', Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 12px;
            opacity: 0.9;
        }
        .code-row { display: flex; gap: 10px; }
        .code-row input {
            flex: 1 1 auto;
            min-width: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 12px 16px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
        }
        .code-row input::placeholder { color: var(--muted); }
        .code-row input:focus { outline: none; border-color: var(--gold); }
        .code-row button {
            flex-shrink: 0;
            padding: 12px 22px;
            background: var(--gold);
            color: #0a0a0a;
            border: 1px solid var(--gold);
            border-radius: 2px;
            font-family: 'Arial Narrow', Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.25s ease;
        }
        .code-row button:hover { background: #d9b95c; }
        @media (max-width: 480px) {
            .code-row { flex-wrap: wrap; }
            .code-row input, .code-row button { flex: 1 1 100%; }
        }

        .footer-note {
            margin-top: 60px;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.06em;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="gem" aria-hidden="true">
        <svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="0.8" width="80" height="80">
            <polygon points="40,6 72,24 72,56 40,74 8,56 8,24"/>
            <line x1="8"  y1="24" x2="72" y2="24"/>
            <line x1="8"  y1="56" x2="72" y2="56"/>
            <line x1="24" y1="6"  x2="8"  y2="24"/>
            <line x1="56" y1="6"  x2="72" y2="24"/>
            <line x1="40" y1="6"  x2="40" y2="74"/>
        </svg>
    </div>

    <p class="eyebrow">Error 404</p>

    <div class="ornament" aria-hidden="true"></div>

    <h1>Página <em>no encontrada</em></h1>

    <p>
        La pieza que buscas no está disponible en este momento.
        Explora nuestras colecciones o vuelve al inicio.
    </p>

    <form class="code-search" action="/colecciones.html" method="get" role="search" aria-label="Buscar una pieza por su código">
        <label class="code-search-label" for="q404">¿Tienes el código de una pieza?</label>
        <div class="code-row">
            <input id="q404" type="search" name="q" placeholder="Ej. 0953" autocomplete="off" maxlength="40" aria-label="Código de la pieza">
            <button type="submit">Buscar</button>
        </div>
    </form>

    <div class="actions">
        <a href="/" class="btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="13" height="13" aria-hidden="true">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/>
            </svg>
            Inicio
        </a>
        <a href="/colecciones.html" class="btn-outline">Colecciones</a>
        <a href="/contacto.html" class="btn-outline">Contacto</a>
    </div>

    <p class="footer-note">BERSAGLIO JEWELRY · Alta Joyería</p>

</body>
</html>
