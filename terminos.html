    <!-- CRITICAL CSS — inline tokens + bj-world + base reset (above-the-fold) -->
    <style>
        :root {
            /* Brand emerald */
            --bj-emerald-900: oklch(28% 0.08 155);
            --bj-emerald-800: oklch(34% 0.11 155);
            --bj-emerald-700: oklch(42% 0.14 155);
            --bj-emerald-600: oklch(52% 0.16 155);
            --bj-emerald-500: oklch(62% 0.18 155);
            --bj-emerald-400: oklch(74% 0.15 152);
            --bj-emerald-300: oklch(85% 0.10 150);
            --bj-emerald-200: oklch(92% 0.05 150);
            --bj-emerald-100: oklch(97% 0.02 150);
            /* Gold */
            --bj-gold-900: oklch(55% 0.12 80);
            --bj-gold-700: oklch(72% 0.14 82);
            --bj-gold-500: oklch(82% 0.14 85);
            --bj-gold-300: oklch(90% 0.08 88);
            --bj-gold-100: oklch(96% 0.04 90);
            /* Neutrals */
            --bj-pearl: oklch(98% 0.005 90);
            --bj-ivory: oklch(96% 0.012 85);
            --bj-cream: oklch(94% 0.018 82);
            --bj-mist:  oklch(90% 0.01 150);
            /* Ink (replaces black) */
            --bj-ink-emerald: oklch(18% 0.05 155);
            --bj-ink-soft:    oklch(32% 0.03 155);
            --bj-ink-mute:    oklch(50% 0.02 155);
            /* Glass */
            --glass-blur: 28px;
            --glass-saturate: 180%;
            --glass-tint: oklch(96% 0.02 150 / 0.55);
            /* Type */
            --font-brand:   "Fraunces", "Cormorant Garamond", "Times New Roman", serif;
            --font-display: "Cormorant Garamond", "Fraunces", "Times New Roman", serif;
            --font-ui:      "Manrope", -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            --font-mono:    "Space Mono", "SF Mono", ui-monospace, Menlo, monospace;
            /* Radii */
            --r-sm: 12px; --r-md: 18px; --r-lg: 24px;
            --r-xl: 34px; --r-2xl: 48px; --r-pill: 999px;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: var(--font-ui);
            color: var(--bj-ink-emerald);
            background: var(--bj-pearl);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.55;
            overflow-x: hidden;
            min-height: 100vh;
        }
        h1,h2,h3,h4 { font-family: var(--font-display); font-weight: 400; letter-spacing: -0.015em; line-height: 1.05; margin: 0; }
        p { margin: 0; }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; border: none; background: none; cursor: pointer; color: inherit; }
        img { max-width: 100%; height: auto; display: block; }
        .container { width: 100%; max-width: 1360px; margin: 0 auto; padding: 0 32px; }
        @media (max-width: 680px) { .container { padding: 0 20px; } }
        /* bj-world global background — below all content (z-index -1) */
        .bj-world {
            position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(1200px 900px at 15% 10%, oklch(92% 0.07 150 / 0.65), transparent 60%),
                radial-gradient(1000px 800px at 90% 20%, oklch(95% 0.06 90 / 0.55), transparent 55%),
                radial-gradient(1400px 1000px at 50% 110%, oklch(88% 0.10 155 / 0.55), transparent 55%),
                linear-gradient(180deg, oklch(97% 0.01 150) 0%, oklch(94% 0.02 150) 50%, oklch(96% 0.015 90) 100%);
            overflow: hidden;
        }
        .bj-world::before, .bj-world::after {
            content: ""; position: absolute; border-radius: 50%;
            filter: blur(60px); opacity: 0.6;
            animation: bjDrift 28s ease-in-out infinite;
        }
        .bj-world::before {
            width: 700px; height: 700px;
            background: radial-gradient(circle, oklch(70% 0.20 155 / 0.55), transparent 70%);
            top: -10%; left: -10%;
        }
        .bj-world::after {
            width: 600px; height: 600px;
            background: radial-gradient(circle, oklch(88% 0.14 85 / 0.5), transparent 70%);
            bottom: -15%; right: -10%;
            animation-delay: -14s;
        }
        @keyframes bjDrift {
            0%,100% { transform: translate(0,0) scale(1); }
            50%     { transform: translate(80px, -60px) scale(1.15); }
        }
        @media (prefers-reduced-motion: reduce) {
            .bj-world::before, .bj-world::after { animation: none; }
        }
        /* Skip link */
        .skip-link {
            position: absolute; top: -100px; left: 16px; z-index: 9999;
            padding: 12px 20px;
            background: var(--bj-emerald-700); color: #fff;
            border-radius: 999px;
            font-family: var(--font-ui); font-size: 12px; font-weight: 500;
            letter-spacing: 0.1em; text-transform: uppercase;
            transition: top 0.2s;
        }
        .skip-link:focus, .skip-link:focus-visible { top: 16px; }
        /* Initial fade-in to avoid FOUC */
        body { opacity: 0; transition: opacity 0.3s ease-out; }
        body.bj-ready { opacity: 1; }
    </style>
