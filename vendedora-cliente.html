<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cliente — Bersaglio</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Manrope:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script type="module" src="js/vendedora/ficha.js"></script>
</head>
<body style="display:none">
<script>try{if(!sessionStorage.getItem('bj_auth'))throw 0}catch(e){location.replace('admin-login.html');document.body.style.display='none'}</script>
<div class="vend-app">
    <header class="vend-topbar">
        <a href="vendedora.html" class="vend-back" aria-label="Volver">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <h1 id="ficha-title">Cliente</h1>
    </header>

    <main class="vend-main">
        <div class="vend-summary" id="ficha-head" hidden>
            <div class="vend-summary-label" id="f-saldo-label">Saldo</div>
            <div class="vend-summary-val" id="f-saldo">—</div>
            <div class="vend-summary-sub" id="f-meta">—</div>
        </div>

        <div class="vend-toolbar" id="ficha-actions" hidden>
            <button id="btn-factura" class="adm-btn adm-btn--primary" style="flex:1">➕ Factura</button>
            <button id="btn-abono" class="adm-btn adm-btn--ghost" style="flex:1">➕ Abono</button>
        </div>

        <div class="vend-empty" id="ficha-error" hidden>Cliente no encontrado o sin acceso.</div>

        <h2 class="vend-section-title" id="hist-title" hidden>Movimientos</h2>
        <div id="mov-list"></div>
        <div class="vend-empty" id="mov-empty" hidden>Sin movimientos todavía. Registra una factura o un abono.</div>
    </main>
</div>

<!-- Modal: registrar movimiento -->
<div class="adm-modal" id="mov-modal" hidden>
    <div class="adm-modal-box">
        <div class="adm-modal-head">
            <h2 id="mov-modal-title">Registrar movimiento</h2>
            <button class="adm-modal-close" id="mov-modal-close" aria-label="Cerrar">
                <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
            </button>
        </div>
        <form id="mov-form">
            <div class="adm-modal-body">
                <div class="adm-form-row adm-col-1">
                    <div class="adm-field">
                        <label for="mov-monto">Monto (COP) <span class="adm-opt">(obligatorio)</span></label>
                        <input type="number" id="mov-monto" class="adm-input" required min="1" step="1" inputmode="numeric">
                    </div>
                </div>
                <div class="adm-form-row adm-col-1">
                    <div class="adm-field">
                        <label for="mov-desc">Descripción</label>
                        <input type="text" id="mov-desc" class="adm-input" maxlength="200" autocomplete="off">
                    </div>
                </div>
            </div>
            <div class="adm-modal-foot">
                <button type="button" class="adm-btn adm-btn--ghost" id="mov-cancel">Cancelar</button>
                <button type="submit" class="adm-btn adm-btn--primary" id="mov-save">Registrar</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: solicitar corrección -->
<div class="adm-modal" id="solic-modal" hidden>
    <div class="adm-modal-box">
        <div class="adm-modal-head">
            <h2>Solicitar corrección</h2>
            <button class="adm-modal-close" id="solic-modal-close" aria-label="Cerrar">
                <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
            </button>
        </div>
        <form id="solic-form">
            <div class="adm-modal-body">
                <p style="color:var(--adm-muted);font-size:13px;margin:0 0 14px;">Kary revisará tu solicitud. Tú no modificas el movimiento; ella lo corrige.</p>
                <div class="adm-form-row adm-col-1">
                    <div class="adm-field">
                        <label for="solic-motivo">¿Qué se debe corregir? <span class="adm-opt">(obligatorio)</span></label>
                        <textarea id="solic-motivo" class="adm-input" required maxlength="300"></textarea>
                    </div>
                </div>
            </div>
            <div class="adm-modal-foot">
                <button type="button" class="adm-btn adm-btn--ghost" id="solic-cancel">Cancelar</button>
                <button type="submit" class="adm-btn adm-btn--primary" id="solic-save">Enviar solicitud</button>
            </div>
        </form>
    </div>
</div>

<div class="adm-toast-wrap" id="toast-wrap"></div>
</body>
</html>
