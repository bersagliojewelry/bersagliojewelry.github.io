<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mis cuentas — Bersaglio</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Manrope:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script type="module" src="js/vendedora/cuentas.js"></script>
</head>
<body style="display:none">
<script>try{if(!sessionStorage.getItem('bj_auth'))throw 0}catch(e){location.replace('admin-login.html');document.body.style.display='none'}</script>
<div class="vend-app">
    <header class="vend-topbar">
        <svg width="26" height="27" viewBox="0 0 80 84" fill="none" aria-hidden="true">
            <circle cx="40" cy="42" r="28" stroke="currentColor" stroke-width="1.2" opacity="0.85" fill="none"/>
            <line x1="40" y1="4" x2="40" y2="80" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
            <text x="40" y="54" text-anchor="middle" font-family="Fraunces, serif" font-weight="600" font-size="32" fill="currentColor">B</text>
        </svg>
        <h1>Mis cuentas</h1>
        <button class="adm-btn adm-btn--ghost adm-btn--sm" id="btn-logout" title="Cerrar sesión">Salir</button>
    </header>

    <main class="vend-main">
        <div class="vend-summary">
            <div class="vend-summary-label">Total por cobrar</div>
            <div class="vend-summary-val" id="vend-por-cobrar">—</div>
            <div class="vend-summary-sub" id="vend-resumen-sub">—</div>
        </div>

        <div class="vend-toolbar">
            <input type="search" id="cli-search" class="adm-input" placeholder="Buscar cliente…">
            <button id="btn-nuevo-cliente" class="adm-btn adm-btn--primary">+ Nuevo cliente</button>
        </div>

        <div class="vend-list" id="clientes-list"></div>
        <div class="vend-empty" id="clientes-empty" hidden>
            Aún no tienes clientes. Crea el primero con “+ Nuevo cliente”.
        </div>
    </main>
</div>

<!-- Modal: nuevo cliente -->
<div class="adm-modal" id="cliente-modal" hidden>
    <div class="adm-modal-box">
        <div class="adm-modal-head">
            <h2>Nuevo cliente</h2>
            <button class="adm-modal-close" id="cliente-modal-close" aria-label="Cerrar">
                <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
            </button>
        </div>
        <form id="cliente-form">
            <div class="adm-modal-body">
                <div class="adm-form-row adm-col-1">
                    <div class="adm-field">
                        <label for="cli-nombre">Nombre <span class="adm-opt">(obligatorio)</span></label>
                        <input type="text" id="cli-nombre" class="adm-input" required maxlength="120" autocomplete="off">
                    </div>
                </div>
                <div class="adm-form-row">
                    <div class="adm-field">
                        <label for="cli-telefono">Teléfono</label>
                        <input type="tel" id="cli-telefono" class="adm-input" maxlength="40" autocomplete="off">
                    </div>
                    <div class="adm-field">
                        <label for="cli-whatsapp">WhatsApp</label>
                        <input type="tel" id="cli-whatsapp" class="adm-input" maxlength="40" autocomplete="off">
                    </div>
                </div>
                <div class="adm-form-row adm-col-1">
                    <div class="adm-field">
                        <label for="cli-cumpleanos">Cumpleaños</label>
                        <input type="date" id="cli-cumpleanos" class="adm-input">
                    </div>
                </div>
            </div>
            <div class="adm-modal-foot">
                <button type="button" class="adm-btn adm-btn--ghost" id="cliente-cancel">Cancelar</button>
                <button type="submit" class="adm-btn adm-btn--primary" id="cliente-save">Crear cliente</button>
            </div>
        </form>
    </div>
</div>

<div class="adm-toast-wrap" id="toast-wrap"></div>
</body>
</html>
